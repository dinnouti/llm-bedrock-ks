[project]
name = "llm-bedrock-ks"
version = "0.1.0"
description = "LLM plugin for Amazon Bedrock - access all Converse API models"
authors = [{name = "Alex Dinnouti"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}

dependencies = [
    "llm>=0.27.1",
    "boto3>=1.34.162",
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
]

[project.urls]
Homepage = "https://github.com/dinnouti/llm-bedrock-ks"
Repository = "https://github.com/dinnouti/llm-bedrock-ks"
Issues = "https://github.com/dinnouti/llm-bedrock-ks/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.entry-points.llm]
bedrock-ks = "llm_bedrock"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: marks tests as integration tests",
]
